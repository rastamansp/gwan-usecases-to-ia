version: '3.8'

services:
  # Aplicação NestJS
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: product-search-app
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:pazdedeus@postgres.gwan.com.br:5433/gwan_mart?sslmode=disable
      - RABBITMQ_URL=amqp://root:pazdeDeus2025@rabbitmq.gwan.com.br:5672
      - RABBITMQ_QUEUE_SEARCH_PRODUCT=search-product
      - PLAYWRIGHT_BROWSER_PATH=/usr/bin/chromium
      - PLAYWRIGHT_HEADLESS=true
      - PLAYWRIGHT_TIMEOUT=30000
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    networks:
      - product-search-network
    restart: unless-stopped

  # Worker Playwright separado
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: product-search-worker
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:pazdedeus@postgres.gwan.com.br:5433/gwan_mart?sslmode=disable
      - RABBITMQ_URL=amqp://root:pazdeDeus2025@rabbitmq.gwan.com.br:5672
      - RABBITMQ_QUEUE_SEARCH_PRODUCT=search-product
      - PLAYWRIGHT_BROWSER_PATH=/usr/bin/chromium
      - PLAYWRIGHT_HEADLESS=true
      - PLAYWRIGHT_TIMEOUT=30000
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    networks:
      - product-search-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  product-search-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
