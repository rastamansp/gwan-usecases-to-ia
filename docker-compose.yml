version: '3.8'

services:
  # Aplicação NestJS - Deploy Direto
  app:
    build:
      context: https://github.com/rastamansp/gwan-usecases-to-ia.git
      dockerfile: Dockerfile.prod
    container_name: product-search-app-prod
    restart: unless-stopped
    networks:
      - gwan
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:pazdedeus@postgres.gwan.com.br:5433/gwan_mart?sslmode=disable
      - RABBITMQ_URL=amqp://root:pazdeDeus2025@rabbitmq.gwan.com.br:5672
      - RABBITMQ_QUEUE_SEARCH_PRODUCT=search-product
      - PLAYWRIGHT_HEADLESS=true
      - PLAYWRIGHT_TIMEOUT=30000
    labels:
      # Configurações do Traefik para domínio e HTTPS
      - "traefik.enable=true"
      - "traefik.docker.network=gwan"
      - "traefik.http.routers.product-search-app.rule=Host(`mart.gwan.com.br`)"
      - "traefik.http.routers.product-search-app.entrypoints=websecure"
      - "traefik.http.routers.product-search-app.tls=true"
      - "traefik.http.routers.product-search-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.product-search-app.loadbalancer.server.port=3000"
      # Security headers
      - "traefik.http.middlewares.product-search-app-headers.headers.sslRedirect=true"
      - "traefik.http.middlewares.product-search-app-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.product-search-app-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.product-search-app-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.product-search-app-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.product-search-app-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.product-search-app-headers.headers.stsPreload=true"
      # CORS middleware
      - "traefik.http.middlewares.product-search-app-cors.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS"
      - "traefik.http.middlewares.product-search-app-cors.headers.accessControlAllowOriginList=https://admin.gwan.com.br,https://www.admin.gwan.com.br,https://mart.gwan.com.br,https://www.mart.gwan.com.br"
      - "traefik.http.middlewares.product-search-app-cors.headers.accessControlAllowHeaders=Content-Type,Authorization"
      - "traefik.http.middlewares.product-search-app-cors.headers.accessControlAllowCredentials=true"
      - "traefik.http.middlewares.product-search-app-cors.headers.accessControlMaxAge=100"
      # Apply both middlewares
      - "traefik.http.routers.product-search-app.middlewares=product-search-app-headers,product-search-app-cors"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Worker Playwright - Deploy Direto
  worker:
    build:
      context: https://github.com/rastamansp/gwan-usecases-to-ia.git
      dockerfile: Dockerfile.worker.prod
    container_name: product-search-worker-prod
    restart: unless-stopped
    networks:
      - gwan
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:pazdedeus@postgres.gwan.com.br:5433/gwan_mart?sslmode=disable
      - RABBITMQ_URL=amqp://root:pazdeDeus2025@rabbitmq.gwan.com.br:5672
      - RABBITMQ_QUEUE_SEARCH_PRODUCT=search-product
      - PLAYWRIGHT_HEADLESS=true
      - PLAYWRIGHT_TIMEOUT=30000
    labels:
      # Configurações do Traefik para domínio e HTTPS
      - "traefik.enable=true"
      - "traefik.docker.network=gwan"
      - "traefik.http.routers.product-search-worker.rule=Host(`mart.gwan.com.br`) && PathPrefix(`/worker`)"
      - "traefik.http.routers.product-search-worker.entrypoints=websecure"
      - "traefik.http.routers.product-search-worker.tls=true"
      - "traefik.http.routers.product-search-worker.tls.certresolver=letsencrypt"
      - "traefik.http.services.product-search-worker.loadbalancer.server.port=3000"
      # Security headers
      - "traefik.http.middlewares.product-search-worker-headers.headers.sslRedirect=true"
      - "traefik.http.middlewares.product-search-worker-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.product-search-worker-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.product-search-worker-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.product-search-worker-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.product-search-worker-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.product-search-worker-headers.headers.stsPreload=true"
      # CORS middleware
      - "traefik.http.middlewares.product-search-worker-cors.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS"
      - "traefik.http.middlewares.product-search-worker-cors.headers.accessControlAllowOriginList=https://admin.gwan.com.br,https://www.admin.gwan.com.br,https://mart.gwan.com.br,https://www.mart.gwan.com.br"
      - "traefik.http.middlewares.product-search-worker-cors.headers.accessControlAllowHeaders=Content-Type,Authorization"
      - "traefik.http.middlewares.product-search-worker-headers.headers.accessControlAllowCredentials=true"
      - "traefik.http.middlewares.product-search-worker-headers.headers.accessControlMaxAge=100"
      # Apply both middlewares
      - "traefik.http.routers.product-search-worker.middlewares=product-search-worker-headers,product-search-worker-cors"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/worker/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

networks:
  gwan:
    external: true
