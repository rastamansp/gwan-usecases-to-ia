version: '3.8'

services:
  # Aplicação NestJS com Git Clone
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod.git
    container_name: product-search-app-prod
    restart: unless-stopped
    networks:
      - gwan
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:pazdedeus@postgres.gwan.com.br:5433/gwan_mart?sslmode=disable
      - RABBITMQ_URL=amqp://root:pazdeDeus2025@rabbitmq.gwan.com.br:5672
      - RABBITMQ_QUEUE_SEARCH_PRODUCT=search-product
      - PLAYWRIGHT_BROWSER_PATH=/usr/bin/chromium
      - PLAYWRIGHT_HEADLESS=true
      - PLAYWRIGHT_TIMEOUT=30000
      - GIT_REPO=https://github.com/rastamansp/gwan-usecases-to-ia.git
      - GIT_BRANCH=main
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.product-search-app.rule=Host(`mart.gwan.com.br`) && PathPrefix(`/api`)"
      - "traefik.http.routers.product-search-app.entrypoints=websecure"
      - "traefik.http.routers.product-search-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.product-search-app.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.product-search-app-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.product-search-app.middlewares=product-search-app-stripprefix"
    volumes:
      - ./logs:/app/logs
      - git-cache:/root/.git
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Worker Playwright com Git Clone
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker.prod.git
    container_name: product-search-worker-prod
    restart: unless-stopped
    networks:
      - gwan
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:pazdedeus@postgres.gwan.com.br:5433/gwan_mart?sslmode=disable
      - RABBITMQ_URL=amqp://root:pazdeDeus2025@rabbitmq.gwan.com.br:5672
      - RABBITMQ_QUEUE_SEARCH_PRODUCT=search-product
      - PLAYWRIGHT_BROWSER_PATH=/usr/bin/chromium
      - PLAYWRIGHT_HEADLESS=true
      - PLAYWRIGHT_TIMEOUT=30000
      - GIT_REPO=https://github.com/rastamansp/gwan-usecases-to-ia.git
      - GIT_BRANCH=main
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.product-search-worker.rule=Host(`mart.gwan.com.br`) && PathPrefix(`/worker`)"
      - "traefik.http.routers.product-search-worker.entrypoints=websecure"
      - "traefik.http.routers.product-search-worker.tls.certresolver=letsencrypt"
      - "traefik.http.services.product-search-worker.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.product-search-worker-stripprefix.stripprefix.prefixes=/worker"
      - "traefik.http.routers.product-search-worker.middlewares=product-search-worker-stripprefix"
    volumes:
      - ./logs:/app/logs
      - git-cache:/root/.git
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

volumes:
  git-cache:
    driver: local

networks:
  gwan:
    external: true
